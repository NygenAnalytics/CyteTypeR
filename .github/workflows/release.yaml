name: Validate R release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(awk -F ': *' '$1 == "Version" {print $2}' DESCRIPTION)"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match DESCRIPTION version $package_version"
            exit 1
          fi

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build source package
        run: R CMD build --no-manual --compact-vignettes=gs+qpdf .

      - name: Check source package
        run: R CMD check --no-manual CyteTypeR_*.tar.gz
