# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.r == 'release'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.r != 'release'
        with:
          extra-packages: any::rcmdcheck, cran/ggrepel@0.9.6
          needs: check

      - name: Rebuild Rtsne without OpenMP on macOS
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          # The macOS Rtsne binary can fail to load with an unresolved
          # ___kmpc_dispatch_init_4u symbol. Use a serial source build in CI.
          # These compiler settings apply only to this Rscript process.
          makevars <- tempfile("Rtsne-Makevars-")
          writeLines(c("SHLIB_OPENMP_CFLAGS =", "SHLIB_OPENMP_CXXFLAGS ="), makevars)
          Sys.setenv(R_MAKEVARS_USER = makevars)
          install.packages("Rtsne", type = "source", dependencies = FALSE)

      - name: Verify macOS dependencies load
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          library(Rtsne)
          library(Seurat)

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
