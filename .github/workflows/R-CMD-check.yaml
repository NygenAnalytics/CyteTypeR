# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # Use CRAN's macOS binaries with CRAN R's bundled OpenMP runtime.
          # Keep Posit Package Manager enabled on Linux and Windows.
          use-public-rspm: ${{ runner.os != 'macOS' }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.r == 'release'
        with:
          # Do not restore macOS binaries from the previous repository setup.
          cache-version: ${{ runner.os == 'macOS' && '2' || '1' }}
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.r != 'release'
        with:
          extra-packages: any::rcmdcheck, cran/ggrepel@0.9.6
          needs: check

      - name: Verify macOS dependencies load
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          print(R.version)
          print(getOption("repos"))
          library(Rtsne)
          library(dotCall64)
          library(SeuratObject)
          library(Seurat)

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
